services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["27018:27017"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo: {condition: service_healthy}
    restart: on-failure
    command:
      - mongosh
      - --host
      - mongo:27017
      - --eval
      - "try { rs.status().ok } catch (error) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
  api:
    build: .
    env_file: .env
    ports: ["8002:8000"]
    depends_on:
      mongo-init: {condition: service_completed_successfully}
