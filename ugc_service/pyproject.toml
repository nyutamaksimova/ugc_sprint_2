[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["research", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["import-untyped", "var-annotated"]

[tool.pytest.ini_options]
pythonpath = ["."]
