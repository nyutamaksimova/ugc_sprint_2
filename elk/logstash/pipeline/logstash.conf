input {
  beats { port => 5044 }
}

filter {
  if [message] =~ /^\{/ {
    json { source => "message" skip_on_invalid_json => true }
  }
  mutate {
    add_field => { "service.name" => "%{[container][name]}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "services-%{+YYYY.MM.dd}"
  }
}
